<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://isharalakshan.xyz/orvix/">
  <meta http-equiv="refresh" content="0; url=/orvix/">
  <title>Redirecting to Orvix…</title>
  <script>
    (() => {
      let target = '';
      try { target = decodeURIComponent(location.hash.slice(1)); }
      catch { target = location.hash.slice(1); }
      if (target) {
        try {
          sessionStorage.setItem('ishara-clean-scroll-target', JSON.stringify({
            path: '/orvix/',
            target,
            focus: false
          }));
        } catch {}
      }
      location.replace('/orvix/' + location.search);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/orvix/">Orvix</a>…</p>
</body>
</html>
